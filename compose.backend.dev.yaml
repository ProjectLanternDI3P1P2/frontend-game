name: lantern-local-dev

services:
  traefik:
    extends: { file: compose.backend.yaml, service: traefik }
  postgres:
    extends: { file: compose.backend.yaml, service: postgres }
  rabbitmq:
    extends: { file: compose.backend.yaml, service: rabbitmq }
  player:
    extends: { file: compose.backend.yaml, service: player }
    image: !reset null
    build:
      context: ../player-backend
      dockerfile: Dockerfile.dev
      secrets: !reset []
      additional_contexts:
        dungeon-contracts: ../dungeon-backend
  combat:
    extends: { file: compose.backend.yaml, service: combat }
    image: !reset null
    build:
      { context: ../combat-backend, dockerfile: Dockerfile.dev, secrets: !reset [] }
  dungeon:
    extends: { file: compose.backend.yaml, service: dungeon }
    image: !reset null
    build:
      { context: ../dungeon-backend, dockerfile: Dockerfile.dev, secrets: !reset [] }
  reward:
    extends: { file: compose.backend.yaml, service: reward }
    image: !reset null
    build:
      { context: ../reward-backend, dockerfile: Dockerfile.dev, secrets: !reset [] }
  leaderboard:
    extends: { file: compose.backend.yaml, service: leaderboard }
    image: !reset null
    build:
      context: ../leaderboard-backend
      dockerfile: Dockerfile.dev
      secrets: !reset []
      additional_contexts:
        combat-contracts: ../combat-backend

networks:
  web:
  backend:

volumes:
  postgres-data:
  rabbitmq-data:
