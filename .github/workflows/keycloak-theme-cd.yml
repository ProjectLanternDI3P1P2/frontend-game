name: CD - Publish Keycloak theme

on:
  push:
    branches: [dev]
    tags: ["v*"]
    paths:
      - keycloak/**
      - .github/workflows/keycloak-theme-cd.yml
  workflow_dispatch:

concurrency:
  group: keycloak-theme-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  IMAGE: 10.4.111.200:18443/lantern/keycloak-theme

jobs:
  prebuild:
    name: Build Keycloak theme image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Build theme image outside the restricted network
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: keycloak
          file: keycloak/Dockerfile
          platforms: linux/amd64
          load: true
          tags: lantern-keycloak-theme-prebuilt:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Export prebuilt image
        shell: bash
        run: docker save "lantern-keycloak-theme-prebuilt:${GITHUB_SHA}" | gzip -1 > prebuilt-image.tar.gz

      - name: Upload prebuilt image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keycloak-theme-prebuilt-${{ github.run_id }}
          path: prebuilt-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish Keycloak theme image
    needs: prebuild
    runs-on: lantern-k3s-builders
    outputs:
      deploy_tag: ${{ steps.image.outputs.deploy_tag }}
    steps:
      - name: Compute immutable tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            deploy_tag="${GITHUB_REF_NAME}"
            tags="${IMAGE}:${deploy_tag}"
          else
            deploy_tag=""
            tags="${IMAGE}:dev-${short_sha}"$'\n'"${IMAGE}:dev-latest"
          fi
          {
            echo "deploy_tag=${deploy_tag}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Log in to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: 10.4.111.200:18443
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Download prebuilt image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: keycloak-theme-prebuilt-${{ github.run_id }}

      - name: Load, tag and push image
        shell: bash
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          gzip -dc prebuilt-image.tar.gz | docker load
          while IFS= read -r tag; do
            docker tag "lantern-keycloak-theme-prebuilt:${GITHUB_SHA}" "${tag}"
            docker push "${tag}"
          done <<< "${TAGS}"

      - name: Verify published image
        shell: bash
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker buildx imagetools inspect "${tag}" >/dev/null
            echo "Verified ${tag}"
          done <<< "${TAGS}"

  promote:
    name: Promote tagged theme in GitOps
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Request Keycloak theme promotion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'ProjectLanternDI3P1P2',
              repo: 'platform-gitops',
              event_type: 'promote-keycloak-theme',
              client_payload: {
                image: process.env.IMAGE,
                tag: '${{ needs.publish.outputs.deploy_tag }}',
                source_repository: context.repo.owner + '/' + context.repo.repo,
                source_revision: context.sha
              }
            });
