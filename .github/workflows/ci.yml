# ADR-FE-007 — This repository owns its own pipeline. A release of the public
# site never requires a release of the game client.
# ADR-FE-012 — Unit tests and the end-to-end suite both run before a change is
# accepted.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ADR-FE-015: the automated half of the accessibility criteria.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The build carries its own identity, as the cycle 1 delivery gate asks.
      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
          NUXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          NUXT_PUBLIC_BUILT_AT: ${{ github.event.repository.updated_at }}

      - name: Start the built application
        run: node .output/server/index.mjs &
      - name: Wait for the application
        run: npx wait-on http://localhost:3000/healthz --timeout 60000

      - name: Cypress
        run: npm run test:e2e
        env:
          CYPRESS_BASE_URL: http://localhost:3000

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Start the built application
        run: node .output/server/index.mjs &
      - name: Wait for the application
        run: npx wait-on http://localhost:3000/healthz --timeout 60000

      # TODO enable light house later when the project is running
      # ADR-FE-014 — Lighthouse detects regressions on representative public
      # routes before a release. It is NOT the reference for real user
      # experience: the field measurements of ADR-FE-013 are.
      # - name: Lighthouse
      #   uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
      #   with:
      #     urls: |
      #       http://localhost:3000/
      #       http://localhost:3000/rules
      #       http://localhost:3000/universe
      #     budgetPath: ./lighthouse-budget.json
      #     uploadArtifacts: true
