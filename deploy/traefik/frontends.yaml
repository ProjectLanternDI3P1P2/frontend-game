http:
  routers:
    # Static browser pages use the portable Keycloak base URL `/auth`. Locally,
    # Keycloak itself is mounted at `/`, so remove that public prefix here.
    keycloak-game:
      entryPoints: [game]
      rule: PathPrefix(`/auth`)
      priority: 100
      middlewares: [strip-keycloak-prefix]
      service: keycloak
    keycloak-public:
      entryPoints: [public]
      rule: PathPrefix(`/auth`)
      priority: 100
      middlewares: [strip-keycloak-prefix]
      service: keycloak
    frontend-game:
      entryPoints: [game]
      rule: PathPrefix(`/`)
      priority: 1
      service: frontend-game
    frontend-public:
      entryPoints: [public]
      rule: PathPrefix(`/`)
      priority: 1
      service: frontend-public

  services:
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080
    frontend-game:
      loadBalancer:
        servers:
          - url: http://frontend-game:3000
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s
    frontend-public:
      loadBalancer:
        servers:
          - url: http://frontend-public:3000
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s

  middlewares:
    strip-keycloak-prefix:
      stripPrefix:
        prefixes: [/auth]
